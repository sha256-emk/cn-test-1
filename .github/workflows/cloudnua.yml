# .github/workflows/cloudnua.yml
# Managed by CloudNua (https://cloudnua.com).
# Uninstall at https://github.com/settings/installations.

name: CloudNua

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: cloudnua-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.x pinned
      - uses: cloudnua/agent-harness-action@12cd568d08ed71e3c756c7ed1ef239a2455c9862  # v1.x pinned
        with:
          api-token: ${{ secrets.CLOUDNUA_API_KEY }}
          # Scan-only mode: no agent to wrap, so we pass a no-op command.
          # The harness still runs pre-scan + post-scan and posts a Check Run.
          # A future v1.x will make this input optional; until then "true"
          # is the documented placeholder.
          agent-command: "true"
